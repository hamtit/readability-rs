[package]
name = "readability-rs"
version = "0.1.0"
edition = "2024"
description = "A Rust port of Mozilla's Readability (article extraction) with a Node-API addon"
license = "Apache-2.0"
repository = "https://github.com/hamtit/readability-rs"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["napi"]
napi = ["dep:napi", "dep:napi-derive"]

[dependencies]
html5ever = "0.40"
regex = "1"
url = "2"
serde_json = "1"
napi = { version = "3", default-features = false, features = ["napi6"], optional = true }
napi-derive = { version = "3", optional = true }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
